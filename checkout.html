<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | SafeBite</title>
<meta name="description" content="SafeBite: allergen-safe food ordering that makes allergen information unmistakable.">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">
<a class="skip" href="#main">Skip to main content</a>
<header id="site-header"></header>
<main id="main">

<div class="wrap page-head"><h1>Checkout</h1><div id="co-empty" class="empty" hidden><h2>Nothing to check out</h2><a class="btn" href="menu.html">Explore Food</a></div>
<form id="co-form" novalidate><div id="co-wrap" class="layout2"><div class="stack">
<h2>Delivery details</h2>
<label class="field">Full name<input type="text" name="name" autocomplete="name" aria-describedby="e-name"></label><p class="err" id="e-name"></p>
<label class="field">Phone number<input type="tel" name="phone" autocomplete="tel" inputmode="numeric" placeholder="10-digit mobile number" aria-describedby="e-phone"></label><p class="err" id="e-phone"></p>
<label class="field">Delivery address<textarea name="address" rows="3" autocomplete="street-address" aria-describedby="e-address"></textarea></label><p class="err" id="e-address"></p>
<fieldset><legend>Payment</legend><label class="check"><input type="radio" name="pay" value="cod" checked> Cash on Delivery</label><label class="check"><input type="radio" name="pay" value="online"> Online payment (mock, no real charge)</label>
<div id="card-box" hidden style="padding:0 12px 12px"><label class="field">Test card number<input type="text" name="card" inputmode="numeric" placeholder="1111 2222 3333 4444" aria-describedby="e-card"></label><p class="err" id="e-card"></p></div></fieldset></div>
<aside class="summary" aria-label="Order summary"><h2>Order summary</h2><div id="co-block" aria-live="assertive"></div><ul class="olist" id="co-items"></ul>
<div class="row tot"><span>Total</span><span id="co-total"></span></div>
<div id="co-review" class="notice warn" hidden><p><strong>Final safety check:</strong> some items are not confirmed safe. Read the notes above.</p><label class="check"><input type="checkbox" name="reviewed"> I reviewed the caution notes and want to continue.</label><p class="err" id="e-reviewed"></p></div>
<button class="btn btn-lg" id="co-place" type="submit">Place order</button></aside></div></form></div>
</main>
<footer id="site-footer"></footer>
<script src="js/main.js"></script>
<script src="js/allergy.js"></script>
<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>

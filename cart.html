<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your cart | SafeBite</title>
<meta name="description" content="SafeBite: allergen-safe food ordering that makes allergen information unmistakable.">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">
<a class="skip" href="#main">Skip to main content</a>
<header id="site-header"></header>
<main id="main">

<div class="wrap page-head"><h1>Your cart</h1><div id="cart-alert" aria-live="assertive"></div>
<div id="cart-empty" class="empty" hidden><h2>Your cart is empty</h2><p>Find dishes that fit your allergy profile.</p><a class="btn" href="menu.html">Explore Food</a></div>
<div id="cart-body" class="layout2" hidden><div><div id="cart-lines"></div><button class="btn btn-ghost btn-sm" id="clear-cart" type="button">Empty cart</button></div>
<aside class="summary" aria-label="Order summary"><h2>Summary</h2><div class="row"><span>Subtotal</span><span id="s-sub"></span></div><div class="row"><span>Delivery fee</span><span id="s-fee"></span></div><div class="row tot"><span>Total</span><span id="s-total"></span></div>
<p class="small muted" id="s-note" aria-live="polite"></p><a class="btn btn-lg" id="go-checkout" href="checkout.html">Continue to checkout</a></aside></div></div>
</main>
<footer id="site-footer"></footer>
<script src="js/main.js"></script>
<script src="js/allergy.js"></script>
<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>

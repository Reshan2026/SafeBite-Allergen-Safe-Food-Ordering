<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allergy profile | SafeBite</title>
<meta name="description" content="SafeBite: allergen-safe food ordering that makes allergen information unmistakable.">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="profile">
<a class="skip" href="#main">Skip to main content</a>
<header id="site-header"></header>
<main id="main">

<div class="wrap page-head"><h1>Your allergy profile</h1><p class="muted">Select every food you are allergic to. We check every dish against this list.</p>
<div id="p-msg" class="notice ok" role="status" aria-live="polite" ></div>
<form id="p-form"><fieldset style="border:0;padding:0;background:none"><legend class="sr" style="position:absolute;left:-999px">Select your allergies</legend><div class="pgrid" id="p-grid"></div></fieldset>
<div class="cta"><button class="btn" type="submit">Save Allergy Profile</button><button class="btn btn-ghost" type="button" id="p-clear">Clear profile</button></div></form>
<div id="p-view" hidden><h2>Saved profile</h2><div class="chips" id="p-chips" style="margin:12px 0 20px"></div><div class="cta"><button class="btn" id="p-edit" type="button">Edit profile</button><a class="btn btn-outline" href="menu.html">Browse safe food</a></div></div>
<p class="notice warn" style="margin-top:24px">Your profile is saved only on this device in your browser. Clearing browser data removes it.</p></div>
</main>
<footer id="site-footer"></footer>
<script src="js/main.js"></script>
<script src="js/allergy.js"></script>
<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
